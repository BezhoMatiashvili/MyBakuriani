project_id = "mybakuriani"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://my-bakuriani.vercel.app"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.sms]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "5MB"

[functions.admin-stats]
verify_jwt = false

[functions.balance-topup]
verify_jwt = false

[functions.booking-create]
verify_jwt = false

[functions.booking-manage]
verify_jwt = false

[functions.company-subscription]
verify_jwt = false

[functions.purchase-vip]
verify_jwt = false

[functions.search]
verify_jwt = false

[functions.smart-match]
verify_jwt = false

[functions.sms-automation-run]
verify_jwt = false

[functions.sms-dispatch]
verify_jwt = false

[functions.upload-photos]
verify_jwt = true

[functions.verify-listing]
verify_jwt = false

[functions.vip-lifecycle]
verify_jwt = false

# Payment endpoints require an authenticated user. They also enforce the bearer
# token via requireUser(), so verify_jwt is defense-in-depth — keep it true.
[functions.payment-create]
verify_jwt = true

[functions.payment-process]
verify_jwt = true
