name: Security checks

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read
  # Required by github/codeql-action/analyze to upload its SARIF results;
  # `actions: read` is what lets it read the workflow run on a private repo.
  security-events: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          cache: npm
      # No --omit=optional: `next lint` needs @parcel/watcher's platform binary,
      # which is an optional dependency, and fails to start without it.
      - run: npm ci
      - run: node scripts/check-secret-permissions.mjs
      - run: npx tsc --noEmit
      - run: npm run lint
      # Repo-only halves of the string-keyed contracts (memory-bank/contracts.md):
      # edge-function names ↔ directories ↔ config.toml, CSP ↔ remotePatterns,
      # admin property_type lists ↔ enum, landing-media mime lists.
      - run: npm run check:contracts
      # Pure-domain unit tests (pricing, scopes, URLs, availability, review
      # allow-list, pageview normaliser, security helpers, banner registry) plus
      # the existing production-config and auth-helper suites.
      - run: npm test
      - run: npm run test:sms-domain
      # Database-side halves of the same contracts, against the STAGING project.
      # Skips itself (exit 0) until STAGING_SUPABASE_URL / STAGING_SUPABASE_SERVICE_ROLE_KEY
      # exist as Actions secrets; with them present it fails on drift between
      # CHECK constraints / enums / the review-gate trigger / the realtime
      # publication and their TypeScript twins.
      - run: npm run check:db-contracts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      # database.generated.ts must equal `supabase gen types` for the staging
      # project. Needs SUPABASE_ACCESS_TOKEN (a personal access token) as a
      # secret; without it the step is skipped rather than failed.
      - if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: npm run types:check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
      # `npm run build` deliberately does NOT run here. It needs
      # SUPABASE_SERVICE_ROLE_KEY + NEXT_PUBLIC_SUPABASE_* to prerender
      # /[locale]/employment, no Actions secrets are configured, and this step
      # sat BEFORE the CodeQL steps — so it aborted the job every single run and
      # is why CodeQL had never once scanned this repo. This project deploys via
      # DigitalOcean App Platform now (mybakuriani-prod on main,
      # mybakuriani-staging on staging), which builds on push to those branches —
      # so the build is still gated there, just not here. Unlike the old Vercel
      # setup, DO does not build PRs, so a PR alone gets no build verification
      # anywhere until it merges.
      # To move it back: add those vars as Actions secrets and re-add the step
      # AFTER the analyze step below.
      # Scanning runs BEFORE the audits on purpose. These steps analyse our own
      # code; a CVE in a third-party dev dependency must never be able to
      # suppress them, which is what the previous ordering did.
      - uses: github/codeql-action/init@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Production dependencies must be clean — this one BLOCKS.
      - run: npm audit --omit=dev --audit-level=high
      # Including dev dependencies this is advisory, not blocking. The only
      # remaining highs are a brace-expansion DoS reaching us through
      # minimatch -> the eslint toolchain; clearing them needs major upgrades of
      # eslint / eslint-config-next, and the vulnerable code is a build-time
      # glob matcher that never ships to a user. Findings stay visible in the
      # step log. Re-tighten to blocking once eslint-config-next is upgraded.
      - run: npm audit --audit-level=high
        continue-on-error: true
