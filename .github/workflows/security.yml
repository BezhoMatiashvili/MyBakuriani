name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1e60f620b9541d4d9c7f2ccfc0b97d6d6d7e2c2a # v4.0.4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - run: node scripts/check-secret-permissions.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - uses: github/codeql-action/init@e6c23b76c5a57dc1d4c6d119d6eb0a0e011f5ecf # v3.28.17
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@e6c23b76c5a57dc1d4c6d119d6eb0a0e011f5ecf # v3.28.17
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
